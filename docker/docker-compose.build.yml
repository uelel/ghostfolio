name: ghostfolio_build
services:
  ghostfolio:
    build: ../
    image: ghostfolio/ghostfolio:local
    extends:
      file: docker-compose.yml
      service: ghostfolio
    env_file:
      - ../.env.prod

  postgres:
    container_name: gf-postgres-build
    extends:
      file: docker-compose.yml
      service: postgres
    env_file:
      - ../.env.prod

  redis:
    container_name: gf-redis-build
    extends:
      file: docker-compose.yml
      service: redis
    env_file:
      - ../.env.prod

  caddy:
    image: caddy:2
    container_name: gf-caddy
    restart: unless-stopped
    command: caddy reverse-proxy --from ghostfolio.localhost --to ghostfolio:3333 --internal-certs
    ports:
      - 80:80
      - 443:443
    volumes:
      - caddy-data:/data
    depends_on:
      - ghostfolio

volumes:
  postgres:
  caddy-data:
